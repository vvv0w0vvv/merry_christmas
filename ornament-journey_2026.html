<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>クリスマスの町をめぐってツリーを完成させる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 「Tap」「Scroll」の文字の書体：Inter（SIL Open Font License。https://fonts.google.com/specimen/Inter ） -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   クリスマスの町をめぐるモック（文字なし。最後のロゴだけ例外）
   ・スクロール：町に着く → ドアが開いて人が出てくる → オーナメントを掲げる（ここで止まる）
   ・タップ：掲げたオーナメントが空へ昇り、上の飾りひもの枠に収まる。収まるとまたスクロールできる
   ・移動：横に流れる旅（空は止めたまま、遠くの丘はゆっくり、町は速く）
   ・最後の広場：ツリーが現れたら止まり、枠のオーナメント（星以外）をタップするとツリーへ飛ぶ。
     6つ付くと星が自動でてっぺんに付いて明かりがつく。そのあとスクロールで町の人が集まる
   ・訪問の数：ページを開くたび（と Play again を押すたび）に Abacus（https://github.com/JasonLovesDoggo/abacus ）で数を1つ増やし、
     返ってきた新しい数を最初の画面に出す。受け取れないとき（ファイルを直接開いたとき・通信が止められているときなど）は何も出さない。
     訪問の様子は、これまでどおり GoatCounter（https://vvv0w0vvv.goatcounter.com ）でも数えて、管理画面で見られる
   ・BGM：シュトレン・スクエア／作曲：ハヤシユウ／配布：OpenTracks（旧DOVA-SYNDROME）
     https://opentracks.com/bgm/detail/23007 （利用条件：https://opentracks.com/help/articles/license/ 。作曲者の条件はこれに準拠）
     ページの背景の音楽として使う。ライセンスの禁止事項（音源の配布、見る人が音声ファイルとして簡単にアクセス・コピーできる状態での利用）に
     当たらないよう、音声ファイルのままでは置かず、中身を並べ替えた bgm.dat にして同じフォルダに置き、鳴らすときだけページの中で元に戻す。
     最初はオフで、右上のボタンを押したときだけ読み込んで鳴らす
   ・案内の文字：「Tap」「Scroll」だけ文字を入れる。書体は Inter。大きさ 13px・太さ 500・字間 0.14em は出典のない仮の値（Cambrium の小さな見出しの値は未計測）
   ・最後の白い帯：リボンが流れてきて、一筆書きの筆記体で Merry Christmas を描く
     書体：EMS Allure（SIL Open Font License。Google Fonts の Allura をもとにした一筆書きの書体。npm の hersheytext に収録）
   ・質感：スポンジのタッチ。細かい粒は 0.1（https://wildandfreetools.com/blog/grainy-noise-css-gradient-generator の範囲の下限）
   ・動きの数値は出典がなく、仮に置いた値。<script> の CFG にまとめた。
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#22305A;overscroll-behavior-y:none}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.journey{position:relative;height:1800svh}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;background:#22305A}
.stage > img.sky{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;z-index:0}
.far{position:absolute;inset:0;z-index:1;background-repeat:repeat-x;will-change:background-position}
.strip{position:absolute;top:0;left:0;height:100%;display:flex;z-index:2;will-change:transform}
.panel{position:relative;height:100%;flex:0 0 auto;overflow:hidden} /* 拡大した絵が隣の町に重ならないよう、町ごとに切り取る */
.panel > img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:50% 100%}
/* 町の絵・寄ったとき用の細かい絵・ドアや人を1つの入れ物にまとめ、一緒に拡大・縮小する（別々に動かすと、ずれて見えることがあるため） */
.zoomer{position:absolute;inset:0;transform:scale(var(--z,1));transform-origin:50% 100%;will-change:transform}
.zoomer > img{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoomer > svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
/* 縦長の画面では、町の絵を下の真ん中を中心に拡大して、家と人を大きく見せる */
/* 縦長の画面で寄ったときに使う、見える範囲だけを細かく描いた絵（拡大しないので、ぼやけない） */
.zoomer > img.close{object-fit:fill;opacity:0;transform:scale(calc(1 / var(--zc, 1)));transform-origin:50% 100%} /* 寄りきったとき画面にぴったり合う。途中の大きさでも町全体の絵と重なる */
/* 町の絵は、画面の枠で切り取らずに置く（縦長の画面で引いたとき、町全体が見えるように）。大きさと位置は layout() で決める */
.zoomer > img.land{inset:auto;object-fit:fill}
.layer{position:absolute;inset:0;pointer-events:none;will-change:transform,opacity}
.layer > img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;object-position:50% 100%}
.layer > svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
#snowCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;z-index:3}
.hud{position:absolute;left:0;top:env(safe-area-inset-top,0px);width:100%;z-index:4;pointer-events:none;overflow:visible;display:block}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.1;z-index:5;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-size:240px 240px}

/* タップの案内：ほわんほわんと呼吸する光と、ゆっくり広がる輪 */
.taps{position:absolute;inset:0;z-index:6;pointer-events:none}
.tap{position:absolute;width:var(--s,96px);height:var(--s,96px);margin:calc(var(--s,96px) / -2) 0 0 calc(var(--s,96px) / -2);
  border:0;padding:0;border-radius:50%;background:transparent;cursor:pointer;pointer-events:auto;opacity:0;visibility:hidden;
  transition:opacity .5s ease,visibility 0s linear .5s;-webkit-tap-highlight-color:transparent}
.tap.on{opacity:1;visibility:visible;transition:opacity .5s ease,visibility 0s}
.tap::before{content:"";position:absolute;inset:-18%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,180,.55) 0%,rgba(255,226,150,.22) 38%,rgba(255,226,150,0) 70%);
  animation:breathe 2.4s ease-in-out infinite}
.tap::after{content:"";position:absolute;inset:8%;border-radius:50%;border:1.5px solid rgba(255,241,200,.85);
  animation:ripple 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.tap i{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:rgba(255,248,226,.95);
  box-shadow:0 0 12px 4px rgba(255,236,180,.8);animation:dot 2.4s ease-in-out infinite}
.tap:focus-visible{outline:2px solid #FFF1C2;outline-offset:4px}
@keyframes breathe{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.08);opacity:1}}
@keyframes ripple{0%{transform:scale(.55);opacity:0}25%{opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes dot{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.15);opacity:1}}
.taps.paused .tap::before,.taps.paused .tap::after,.taps.paused .tap i,.taps.paused .lbl{animation-play-state:paused}
/* 案内の文字（Inter）。光の呼吸に合わせて、ほんのり明るくなったり暗くなったりする */
.lbl{position:absolute;left:50%;transform:translateX(-50%);font:500 13px/1 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.14em;
  color:#FBEFD9;text-shadow:0 1px 8px rgba(29,42,82,.8);white-space:nowrap;pointer-events:none;animation:lbl 2.4s ease-in-out infinite}
.tap .lbl{bottom:calc(100% + 2px);padding-left:.14em}
@keyframes lbl{0%,100%{opacity:.6}50%{opacity:1}}
.tapLabel{position:absolute;top:0;left:50%;z-index:6;visibility:hidden;padding-left:.14em}
/* BGM のオン・オフ：上の飾りひもの下の右端。最後の白い帯まで同じ場所に出す */
.sound{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:96px;z-index:20;display:flex;align-items:center;gap:.5em;padding:8px 13px 8px 10px;
  border:1px solid rgba(251,239,217,.35);border-radius:999px;background:rgba(29,42,82,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  color:#FBEFD9;font:500 13px/1 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.14em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sound svg{width:16px;height:16px;flex:0 0 auto}
.sound .wv{opacity:0;transition:opacity .3s ease}
.sound[aria-pressed="true"] .wv{opacity:1}
.sound[aria-pressed="true"] .x{opacity:0}
.sound .x{transition:opacity .3s ease}
.sound:focus-visible{outline:2px solid #FBEFD9;outline-offset:3px}
/* 訪問の数：最初の画面の、上の飾りひもの下に出し、スクロールを始めると薄くなって消える */
.visits{position:absolute;left:50%;top:0;z-index:6;transform:translateX(-50%);pointer-events:none;opacity:0}
.visits .in{display:flex;align-items:center;gap:.6em;opacity:0;transition:opacity 1.2s ease;
  font:500 13px/1 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.14em;color:#FBEFD9;white-space:nowrap;text-shadow:0 1px 10px rgba(29,42,82,.8)}
.visits.ready .in{opacity:1}
.visits svg{width:14px;height:14px;flex:0 0 auto;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,226,150,.9));animation:dot 2.4s ease-in-out infinite}
.tapLabel.on{visibility:visible}
/* サンタクロースの町に近づくあいだだけ出るオーロラ */
.aurora{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;z-index:0;opacity:0;pointer-events:none}

/* スクロールの案内：最初の1回だけ */
.scrollHint{position:absolute;left:50%;bottom:max(22px,calc(env(safe-area-inset-bottom,0px) + 14px));z-index:6;width:26px;height:42px;margin-left:-13px;
  border:1.5px solid rgba(42,46,72,.75);border-radius:14px;transition:opacity .6s ease;pointer-events:none}
.scrollHint::before{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#2A2E48;animation:wheel 1.8s ease-in-out infinite}
.scrollHint::after{content:"";position:absolute;left:50%;top:50px;width:1px;height:26px;background:linear-gradient(rgba(42,46,72,.7),rgba(42,46,72,0));animation:trail 1.8s ease-in-out infinite}
.scrollHint.gone{opacity:0}
.scrollHint .lbl{bottom:calc(100% + 10px);padding-left:.14em;color:#2A2E48;text-shadow:0 0 8px rgba(244,247,252,.9)}
@keyframes wheel{0%{transform:translateY(0);opacity:0}25%{opacity:1}80%{transform:translateY(14px);opacity:0}100%{opacity:0}}
@keyframes trail{0%,20%{transform:scaleY(0);transform-origin:50% 0}60%{transform:scaleY(1);transform-origin:50% 0}61%{transform-origin:50% 100%}100%{transform:scaleY(0);transform-origin:50% 100%}}

/* 最後の白い帯：雪の地面の続き。リボンが流れてきて文字になる */
.logoSec{position:relative;height:280svh;background:#F4F7FC}
.logoStage{position:sticky;top:0;height:100svh;overflow:hidden;background:linear-gradient(#F4F7FC,#EDF2F9)}
#ribbonCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.logoStage .grain{z-index:2}
/* 「Play again」：Tap・Scroll と同じ書体で、やや大きめ（20px。仮の値）。タップの案内と同じ、呼吸する光と広がる輪 */
.play{position:absolute;left:50%;top:72%;z-index:3;transform:translate(-50%,-50%);border:0;background:transparent;padding:22px 34px;cursor:pointer;
  font:500 20px/1 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.14em;color:#2A2E48;white-space:nowrap;-webkit-tap-highlight-color:transparent;
  opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.play.on{opacity:1;visibility:visible;transition:opacity .6s ease,visibility 0s}
.play::before{content:"";position:absolute;inset:-14% -8%;border-radius:999px;background:radial-gradient(closest-side,rgba(255,226,150,.55),rgba(255,226,150,.18) 60%,rgba(255,226,150,0));animation:breathe 2.4s ease-in-out infinite}
.play::after{content:"";position:absolute;inset:4px;border-radius:999px;border:1.5px solid rgba(226,178,60,.9);animation:ripple 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.play span{position:relative;padding-left:.14em;animation:lbl 2.4s ease-in-out infinite}
.play:focus-visible{outline:2px solid #2A2E48;outline-offset:4px}

@media (prefers-reduced-motion: reduce){
  .tap::before,.tap::after,.tap i,.scrollHint::before,.scrollHint::after,.lbl,.play::before,.play::after,.play span,.visits svg{animation:none}
  .tap::after{transform:scale(1);opacity:.9}
}
</style>
</head>

  <!-- 掲げたオーナメントの形が、明るい背景（白いかまくらなど）の前でも分かるよう、夜空の色のごく薄い影を付ける -->

const relOf = (t0, ms) => t0 ? clamp((NOW - t0) / (reduce ? 300 : ms)) : 0;
function release(k){ const T = TOWNS[k]; if (T.released) return; T.released = performance.now(); showTap(T.tap, false); kick(true); }
function place(k){ if (FIN.placed[k]) return; FIN.placed[k] = performance.now(); showTap(placeTaps[k], false); kick(true); }
const townStored = k => TOWNS[k].released && relOf(TOWNS[k].released, CFG.FLY_MS) >= 1;
function placeRel(k){ return relOf(FIN.placed[k], k === 'gift' ? CFG.GIFT_MS : CFG.PLACE_MS); }

/* ------------------------------------------------------------------
   町の中の動き
   ------------------------------------------------------------------ */
const B = CFG.BEAT;
function renderTown(T, tau, panelX){
  const D = T.door, open = smooth(beat(tau, B.door));
  if (T.leaf) T.leaf.setAttribute('transform', `scale(${(1 - 0.86 * open).toFixed(3)} 1)`);
  T.inside.setAttribute('opacity', T.igloo ? (0.45 + 0.55 * open).toFixed(3) : 1);
  T.spill.setAttribute('opacity', (open * 0.9).toFixed(3));
  const n = T.people.length, span = (B.walk[1] - B.walk[0]) - (n - 1) * CFG.WALK_GAP, raise = smooth(beat(tau, B.raise));
  // 掲げる人は、オーナメントが画面からはみ出さない位置まで内側に寄せる（42 はオーナメントの半分の幅と余白。絵の座標）
  const lim = (W / 2) / pageMap(ZC).sc - 42;
  const rel = relOf(T.released, CFG.FLY_MS);
  let elderHand = null, dogCollar = null;
  T.people.forEach((p, idx) => {
    const s = clamp((tau - B.walk[0] - idx * CFG.WALK_GAP) / span), e = smooth(s);
    const tx = p.c.raise ? clamp(D.cx + p.c.dx, 720 - lim, 720 + lim) : D.cx + p.c.dx;
    const x = lerp(D.cx, tx, e), y = lerp(D.base, D.base + p.c.dy, e), sc = 1 + (y - D.base) * 0.0025;
    const walkLen = Math.hypot(tx - D.cx, p.c.dy);
    const ph = walkLen * e / (p.H * (p.c.t === 'dog' ? 0.5 : 0.24)) * Math.PI, moving = s > 0 && s < 1;
    const sw = moving ? Math.sin(ph) : 0, bob = moving ? Math.abs(Math.sin(ph)) * (p.c.t === 'dog' ? 1.5 : 2.2) : 0;
    p.g.setAttribute('transform', `translate(${f1(x)} ${f1(y - bob)}) scale(${sc.toFixed(3)})`);
    p.g.setAttribute('opacity', clamp(s / 0.14).toFixed(3));
    if (p.c.t === 'dog'){ dogPose(p, sw, Math.sin(ph * 1.5) * 14); dogCollar = [x - 15 * sc, y - bob - 24 * sc]; return; }
    walkPose(p, sw);
    let aL, aR;
    if (p === T.raiser){ const back = smooth(beat(rel, [0.15, 0.45])); aL = lerp(lerp(10 - 14 * sw, 168, raise), 150, back); aR = lerp(lerp(-10 - 14 * sw, -168, raise), -150, back); }
    else { aL = 10 + 14 * sw; aR = lerp(-10 + 14 * sw, -150, raise); }
    if (p.c.cane) aR = -6;
    p.amL.setAttribute('transform', `translate(${f1(-p.shX)} ${f1(p.shY)}) rotate(${f1(aL)})`);
    p.amR.setAttribute('transform', `translate(${f1(p.shX)} ${f1(p.shY)}) rotate(${f1(aR)})`);
    p.pos = [x, y - bob, sc, s];
    if (p.c.cane) elderHand = handPos(p, -1, aL, x, y - bob, sc);
  });
  if (T.leash && elderHand && dogCollar){
    const mx = (elderHand[0] + dogCollar[0]) / 2, my = Math.max(elderHand[1], dogCollar[1]) + 14;
    T.leash.setAttribute('d', `M${f1(elderHand[0])} ${f1(elderHand[1])} Q${f1(mx)} ${f1(my)} ${f1(dogCollar[0])} ${f1(dogCollar[1])}`);
    T.leash.setAttribute('opacity', T.people[0].g.getAttribute('opacity'));
  }
  const p = T.raiser, [rx, ry, rsc, rs] = p.pos, base = HAND_H / ORN_H[T.key];
  const chest = ry + (p.shY + p.H * 0.18) * rsc, over = ry + (p.shY - p.armL - HAND_H * 0.55) * rsc;
  const hx = rx, hy = lerp(chest, over, raise), hs = base * rsc;
  const [ox, oy, os] = T.released ? flight(T.key, hx, over, hs, rel) : [hx, hy, hs];
  T.orn.setAttribute('transform', `translate(${f1(ox)} ${f1(oy)})`);
  T.ornScale.setAttribute('transform', `scale(${os.toFixed(4)})`);
  T.orn.setAttribute('opacity', (clamp(rs / 0.14) * (1 - beat(rel, [0.95, 1]))).toFixed(3));
  // タップを待つ：掲げきって、まだ放していないとき
  const waiting = !T.released && tau >= 0.47 && Math.abs(panelX) < 2;
  const [sx, sy] = pageToScreen(hx, over, panelX);
  showTap(T.tap, waiting, sx, sy);
}
function renderSanta(T, tau, panelX){
  // そりは、上の飾りひもの下から地面の手前（絵の座標 640）までの空きに収まる大きさにする
  //   423 は、サンタの帽子の先からプレゼントの下までの高さ（絵の座標）。0.72 は縦長の画面での上限で、見た目で置いた値
  const M = pageMap(), halfW = (W / 2) / M.sc, top = (HUD_BOTTOM + 14 - M.oy) / M.sc;
  const SS = clamp((640 - top) / 423, 0.5, MOBILE ? 0.72 : 1), sy = top + 235 * SS;
  const cX = 720 - GIFT_OFF[0] * SS, rel = relOf(T.released, CFG.FLY_MS);
  const enter = smooth(beat(tau, B.santaIn)), exit = smooth(beat(rel, [0.2, 0.9]));
  const sx = T.released ? lerp(cX, 720 - halfW - 170 * SS, exit) : lerp(720 + halfW + 500 * SS, cX, enter);
  T.slg.setAttribute('transform', `translate(${f1(sx)} ${f1(sy)}) scale(${SS})`);
  T.slg.style.display = enter > 0 && exit < 1 ? '' : 'none';
  T.rope.style.display = T.released ? 'none' : '';
  const hx = cX + GIFT_OFF[0] * SS, hy = sy + GIFT_OFF[1] * SS;
  const [ox, oy, os] = T.released ? flight('gift', hx, hy, SS, rel) : [sx + GIFT_OFF[0] * SS, hy, SS];
  T.orn.setAttribute('transform', `translate(${f1(ox)} ${f1(oy)})`);
  T.ornScale.setAttribute('transform', `scale(${os.toFixed(4)})`);
  T.orn.setAttribute('opacity', ((enter > 0 ? 1 : 0) * (1 - beat(rel, [0.95, 1]))).toFixed(3));
  const waiting = !T.released && tau >= 0.47 && Math.abs(panelX) < 2;
  const [tx, ty] = pageToScreen(hx, hy, panelX);
  showTap(T.tap, waiting, tx, ty);
}

// 背景ではたらくサンタと小人の動き（t は秒）。動きの速さ・幅は出典のない仮の値
function renderWorkers(T, t){
  const arms = (p, aL, aR) => { p.amL.setAttribute('transform', `translate(${f1(-p.shX)} ${f1(p.shY)}) rotate(${f1(aL)})`); p.amR.setAttribute('transform', `translate(${f1(p.shX)} ${f1(p.shY)}) rotate(${f1(aR)})`); };
  T.wk.forEach(p => {
    const w = p.w, ph = w.phase || 0;
    let x = w.x, y = w.y, dir = 1, sw = 0, bob = 0;
    if (w.kind === 'carry'){
      // 袋をかついで行ったり来たり
      const a = t * (w.speed || 0.4) + ph; x = w.x + w.range * Math.sin(a); dir = Math.cos(a) >= 0 ? 1 : -1;
      sw = Math.sin(t * 5 + ph); bob = Math.abs(sw) * 2; arms(p, 12 * sw, -150);
    } else if (w.kind === 'wrap'){
      // 台の上の箱を包む：両手を交互に動かす
      const a = Math.sin(t * 3 + ph); arms(p, -32 + 14 * a, 32 + 14 * a); bob = Math.abs(a) * 1;
    } else if (w.kind === 'deliver'){
      // 箱をそりまで運び、置いたら手ぶらで戻る
      const P = 7, c = ((t + ph) % P) / P;
      let e, carrying;
      if (c < 0.42){ e = smooth(c / 0.42); carrying = true; dir = 1; }
      else if (c < 0.5){ e = 1; carrying = c < 0.47; dir = 1; }
      else if (c < 0.92){ e = 1 - smooth((c - 0.5) / 0.42); carrying = false; dir = -1; }
      else { e = 0; carrying = c > 0.96; dir = 1; }
      x = lerp(w.x, w.to, e); const moving = (c < 0.42 || (c >= 0.5 && c < 0.92));
      sw = moving ? Math.sin(t * 6) : 0; bob = Math.abs(sw) * 2;
      p.prop.style.display = carrying ? '' : 'none';
      if (carrying) arms(p, -38, 38); else arms(p, 12 * sw, -12 * sw);
    } else if (w.kind === 'wave'){
      arms(p, 10, -150 + 22 * Math.sin(t * 5 + ph));
    } else if (w.kind === 'hop'){
      // 箱を頭の上に持ち上げたまま、小さく跳ねる
      bob = Math.abs(Math.sin(t * 3 + ph)) * 6; arms(p, 160, -160);
    }
    walkPose(p, sw);
    p.g.setAttribute('transform', `translate(${f1(x)} ${f1(y - bob)}) scale(${dir} 1)`);
  });
}

/* ------------------------------------------------------------------
   最後の広場
   ------------------------------------------------------------------ */
function renderFinale(q, panelX){
  const a = reduce ? (q >= CFG.F_TREE[0] ? 1 : 0) : smooth(beat(q, CFG.F_TREE));
  treeL.style.opacity = a; treeL.style.transform = `translate3d(0,${((1 - a) * 5).toFixed(2)}vh,0) scale(${(0.96 + 0.04 * a).toFixed(4)})`;
  const atGate = q >= CFG.F_GATE - 0.005 && Math.abs(panelX) < 2;
  const Tm = treeMap(), halfW = (W / 2) / Tm.m;
  // 枠からツリーへ（タップした順）
  PLACE_KEYS.forEach(k => {
    const o = FO[k], placed = FIN.placed[k];
    showTap(placeTaps[k], atGate && !placed, SLOTS[k].x, hudTop + SLOTS[k].y);
    if (!placed){ o.g.setAttribute('opacity', 0); return; }
    const rel = placeRel(k), [sx, sy, ss] = slotInTree(k), [tx, ty] = SPOT[k];
    if (k === 'gift'){
      // サンタのそりが枠からプレゼントを受け取り、ツリーへ運んで飾る
      const sp = smooth(beat(rel, [0, 0.62])), sleighX = lerp(720 + halfW + 500, 720 - halfW - 200, beat(rel, [0, 1])), sleighY = 150;
      FO.sleigh.g.style.display = rel > 0 && rel < 1 ? '' : 'none';
      FO.sleigh.g.setAttribute('transform', `translate(${f1(sleighX)} ${sleighY}) scale(.8)`);
      const grab = beat(rel, [0, 0.3]), drop = beat(rel, [0.45, 0.75]);
      let gx, gy, gs;
      const hangX = sleighX + GIFT_OFF[0] * 0.8, hangY = sleighY + GIFT_OFF[1] * 0.8;
      if (drop > 0){ const e = smooth(drop); gx = lerp(720, tx, e); gy = lerp(hangY, ty, e * e); gs = lerp(0.8, 1, e); }
      else if (grab < 1){ const e = smooth(grab); gx = lerp(sx, hangX, e); gy = lerp(sy, hangY, e); gs = lerp(ss / ORN_H.gift, 0.8, e); }
      else { gx = hangX; gy = hangY; gs = 0.8; }
      if (drop > 0 && rel >= 0.75){ gx = tx; gy = ty; gs = 1; }
      o.g.setAttribute('transform', `translate(${f1(gx)} ${f1(gy)})`); o.s.setAttribute('transform', `scale(${gs.toFixed(4)})`);
      void sp;
    } else {
      const e = smooth(rel);
      o.g.setAttribute('transform', `translate(${f1(qb(sx, (sx + tx) / 2, tx, e))} ${f1(qb(sy, Math.min(sy, ty) - 60, ty, e))})`);
      o.s.setAttribute('transform', `scale(${lerp(ss / ORN_H[k], 1, e).toFixed(4)})`);
    }
    o.g.setAttribute('opacity', 1);
    setFill(k, 0);
  });
  if (!FIN.placed.gift) FO.sleigh.g.style.display = 'none';
  const anyTap = PLACE_KEYS.some(k => placeTaps[k].classList.contains('on'));
  tapLabel.classList.toggle('on', anyTap); tapLabel.style.top = f1(HUD_BOTTOM + 6) + 'px';
  // 6つ付いたら、星が自動でてっぺんへ。そのあと明かりがつく
  const allPlaced = PLACE_KEYS.every(k => FIN.placed[k] && placeRel(k) >= 1);
  if (allPlaced && !FIN.starT) FIN.starT = performance.now();
  const sr = relOf(FIN.starT, CFG.STAR_MS);
  if (FIN.starT){
    const [sx, sy, ss] = slotInTree('star'), [tx, ty] = SPOT.star, e = smooth(sr);
    FO.star.g.setAttribute('transform', `translate(${f1(qb(sx, (sx + tx) / 2, tx, e))} ${f1(qb(sy, Math.min(sy, ty) - 80, ty, e))})`);
    FO.star.s.setAttribute('transform', `scale(${lerp(ss / ORN_H.star, 1, e).toFixed(4)})`);
    FO.star.g.setAttribute('opacity', 1); setFill('star', 0);
  } else FO.star.g.setAttribute('opacity', 0);
  const lr = FIN.starT ? clamp((NOW - FIN.starT - (reduce ? 300 : CFG.STAR_MS)) / (reduce ? 300 : CFG.LIGHT_MS)) : 0;
  lightL.style.opacity = lr.toFixed(3);
  FIN.done = lr >= 1;
  // 人が集まる（明かりがついたあと、スクロールで）
  const g = beat(q, CFG.F_GATHER), cheer = smooth(beat(q, CFG.F_CHEER));
  CROWD.forEach(p => {
    const s = clamp((g - p.order * 0.03) / (1 - 0.03 * 8)), e = smooth(s);
    const sx0 = p.side < 0 ? 720 - halfW - 60 : 720 + halfW + 60, x = lerp(sx0, p.tx, e);
    const ph = Math.abs(p.tx - sx0) * e / (p.H * (p.c.t === 'dog' ? 0.5 : 0.24)) * Math.PI, moving = s > 0 && s < 1;
    const sw = moving ? Math.sin(ph) : 0, bob = moving ? Math.abs(Math.sin(ph)) * 2 : 0;
    p.g.setAttribute('transform', `translate(${f1(x)} ${f1(p.ty - bob)}) scale(${p.c.t === 'dog' && p.side < 0 ? -1 : 1} 1)`);
    p.g.setAttribute('opacity', s > 0 ? 1 : 0);
    if (p.c.t === 'dog'){ dogPose(p, sw, Math.sin(ph * 1.5) * 14); return; }
    walkPose(p, sw);
    const aL = lerp(10 + 14 * sw, 150, cheer), aR = p.c.cane ? -6 : lerp(-10 - 14 * sw, -150, cheer);
    p.amL.setAttribute('transform', `translate(${f1(-p.shX)} ${f1(p.shY)}) rotate(${f1(aL)})`);
    p.amR.setAttribute('transform', `translate(${f1(p.shX)} ${f1(p.shY)}) rotate(${f1(aR)})`);
  });
  cv.style.opacity = lr.toFixed(3); snowWanted = lr > 0; snowControl();
}

/* ------------------------------------------------------------------
   雪（明かりがついたあと、時間で降り続ける。画面の外では止める）
   ------------------------------------------------------------------ */
const cv = $('#snowCv'), ctx = cv.getContext('2d');
let flakes = [], raf = 0, last = 0, snowWanted = false, inView = true;
function sizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  flakes = Array.from({ length: Math.round(W * Hh / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * Hh, r: 1 + Math.random() * 2.6, v: 20 + Math.random() * 40, ph: Math.random() * 6.283, a: .5 + Math.random() * .5 }));
}
function drawSnow(t){
  ctx.clearRect(0, 0, W, Hh); ctx.fillStyle = '#FFFFFF';
  for (const f of flakes){ ctx.globalAlpha = f.a; ctx.beginPath(); ctx.arc(f.x + Math.sin(t / 1000 + f.ph) * 8, f.y, f.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function tick(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const f of flakes){ f.y += f.v * dt; if (f.y > Hh + 6){ f.y = -6; f.x = Math.random() * W; } }
  drawSnow(now); raf = requestAnimationFrame(tick);
}
function snowControl(){
  const run = snowWanted && inView && !reduce;
  if (run && !raf){ last = performance.now(); raf = requestAnimationFrame(tick); }
  if (!run && raf){ cancelAnimationFrame(raf); raf = 0; }
  if (reduce && snowWanted) drawSnow(0);
}

/* ------------------------------------------------------------------
   スクロール位置 ⇔ 物語の位置
   ------------------------------------------------------------------ */
// 1つの町のスクロール量は、縦長の画面とPCで違う（layout() で決める）
let TS = CFG.TOWN_SCREENS, TOWN_S = CFG.TOWNS * TS, S_TOTAL = TOWN_S + CFG.FINALE_SCREENS;
function scrollToU(){
  const rect = journey.getBoundingClientRect(), total = Math.max(1, journey.offsetHeight - Hh);
  const s = clamp(-rect.top / total) * S_TOTAL;
  return s < TOWN_S ? s / TS : CFG.TOWNS + (s - TOWN_S) / CFG.FINALE_SCREENS;
}
function uToY(u){
  const s = u < CFG.TOWNS ? u * TS : TOWN_S + (u - CFG.TOWNS) * CFG.FINALE_SCREENS;
  return journey.offsetTop + s / S_TOTAL * Math.max(1, journey.offsetHeight - Hh);
}
// タップを待つ位置：その先へは、タップして収まるまでスクロールできない
function openGate(){
  for (let k = 0; k < CFG.TOWNS; k++) if (!townStored(k)) return k + modeCfg().gate;
  if (!FIN.done) return CFG.TOWNS + CFG.F_GATE;
  return null;
}

function render(u){
  const MC = modeCfg(), k = Math.min(CFG.TOWNS, Math.floor(u)), t = u < CFG.TOWNS ? u - k : 0;
  const cx = u < CFG.TOWNS ? k + (reduce ? (t >= 0.78 ? 1 : 0) : smooth(beat(t, MC.travel))) : CFG.TOWNS;
  strip.style.transform = `translate3d(${(-cx * W).toFixed(1)}px,0,0)`;
  // 縦長の画面：着いたら引き、スクロールで寄り、収まったあとは引いてから横へ
  let zCur = ZC;
  if (MOBILE && !reduce) zCur = u >= CFG.TOWNS ? ZW : t < CFG.M_ZOOM_OUT[0] ? lerp(ZW, ZC, smooth(beat(t, CFG.M_ZOOM_IN))) : lerp(ZC, ZW, smooth(beat(t, CFG.M_ZOOM_OUT)));
  const zOf = j => reduce || !MOBILE ? ZC : (j === k && u < CFG.TOWNS) ? zCur : ZW;
  panels.forEach((p, j) => {
    const z = zOf(j); p.style.setProperty('--z', z.toFixed(4));
    const T = TOWNS[j]; if (T && T.closeImg) T.closeImg.style.opacity = clamp((z - (ZC - 0.12)) / 0.12).toFixed(3);
  });
  const M = pageMap(zCur);
  farEl.style.backgroundSize = `${f1(1440 * M.sc)}px ${f1(900 * M.sc)}px`;
  farEl.style.backgroundPosition = `${f1(M.ox - cx * W * CFG.FAR_SPEED)}px ${f1(M.oy)}px`;
  panels.forEach((p, j) => { p.style.visibility = Math.abs(j - cx) < 1.05 ? 'visible' : 'hidden'; });
  auroraEl.style.opacity = clamp(1 - Math.abs(cx - AURORA_TOWN)).toFixed(3);
  // 今の町と隣の町
  [k - 1, k, k + 1].forEach(j => {
    const T = TOWNS[j]; if (!T) return;
    const panelX = (j - cx) * W; if (Math.abs(panelX) > W * 1.05) return;
    const tau = j < k ? 0.48 : j > k ? 0 : (reduce ? (t < 0.25 ? 0 : 0.48) : remap(t, MC.keys));
    ZNOW = zOf(j);
    T.santa ? renderSanta(T, tau, panelX) : renderTown(T, tau, panelX);
  });
  lastCx = cx;
  TOWNS.forEach((T, j) => { if (T.wk && Math.abs(j - cx) < 0.999) renderWorkers(T, reduce ? 0 : NOW / 1000); });
  // 上の枠
  SLOT_ORDER.forEach(key => { const T = TOWNS[TOWN_OF[key]]; setFill(key, T.released ? beat(relOf(T.released, CFG.FLY_MS), [0.95, 1]) : 0); });
  ZNOW = zOf(k);
  renderFinale(u >= CFG.TOWNS ? u - CFG.TOWNS : 0, (CFG.TOWNS - cx) * W);
  hintEl.classList.toggle('gone', !hintWanted());
  // 訪問の数：引きで止まる区間（PC は着いたところで止まる区間）の前半で、少しずつ薄くなって消える
  { const hold = MC.keys[1][0] * (MOBILE && !reduce ? CFG.M_ZOOM_IN[0] / MC.keys[1][0] : 1); visitsEl.style.opacity = (u < CFG.TOWNS ? 1 - clamp(u / Math.max(0.02, hold * 0.5)) : 0).toFixed(3); }
  tapsEl.classList.toggle('paused', !inView);
}

// 「Scroll」を出すとき：最初の画面／オーナメントが枠に収まって、まだスクロールしていないとき／
// 最後の広場で明かりがついて、まだスクロールしていないとき／最後の広場の終わり（白い帯へ進む前）
function hintWanted(){
  if (uT < 0.01) return true;
  for (let k = 0; k < CFG.TOWNS; k++){ const g = k + modeCfg().gate; if (Math.abs(uT - g) < 0.02) return townStored(k); }
  const q = uT - CFG.TOWNS;
  if (q >= CFG.F_GATE - 0.01 && q <= CFG.F_GATE + 0.02) return FIN.done;
  return q >= 0.97;
}

/* ------------------------------------------------------------------
   スクロール：なめらかに追いつく。タップ待ちの位置より先へは進めない
   ------------------------------------------------------------------ */
let uT = 0, uS = 0, looping = false, lastT = 0, lastCx = 0;
const workersVisible = () => !reduce && TOWNS.some((T, j) => T.wk && Math.abs(j - lastCx) < 0.999); // 画面に少しでも見えているときだけ動かす
const animating = () => workersVisible() || TOWNS.some(T => T.released && relOf(T.released, CFG.FLY_MS) < 1) || PLACE_KEYS.some(k => FIN.placed[k] && placeRel(k) < 1) || (FIN.starT && !FIN.done);
function loop(now){
  NOW = now;
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (reduce) uS = uT; else uS += (uT - uS) * (1 - Math.exp(-CFG.SMOOTH * dt));
  if (Math.abs(uT - uS) < 0.0004) uS = uT;
  render(uS);
  if ((uS !== uT || animating()) && inView) requestAnimationFrame(loop); else looping = false;
}
function kick(){ if (!looping){ looping = true; lastT = performance.now(); requestAnimationFrame(loop); } }
function clampToGate(){
  const g = openGate(); if (g === null) return false;
  if (uT > g + 0.002){ uT = g; window.scrollTo(0, uToY(g)); return true; }
  return false;
}
let touchY = null;
const atGate = () => { const g = openGate(); return g !== null && uT >= g - 0.003; };
// 前の場面には戻れない：今いる場面（町・最後の広場・白い帯）の中では上に戻れるが、その始まりより上へは戻れない
let maxU = 0, logoReached = false;
function floorY(){ return logoReached ? logoSec.offsetTop : uToY(Math.min(CFG.TOWNS, Math.floor(maxU + 1e-6))); }
function enforceFloor(){
  if (window.scrollY >= logoSec.offsetTop - 1) logoReached = true;
  const f = floorY(); if (window.scrollY < f - 2){ window.scrollTo(0, f); return true; } return false;
}
const atFloor = () => window.scrollY <= floorY() + 2;
addEventListener('scroll', () => { enforceFloor(); }, { passive: true });
addEventListener('wheel', e => { if (e.deltaY < 0 && atFloor()) e.preventDefault(); }, { passive: false });
addEventListener('touchmove', e => { if (touchY !== null && e.touches[0].clientY > touchY && atFloor()) e.preventDefault(); }, { passive: false });
addEventListener('keydown', e => { if ((['ArrowUp', 'PageUp', 'Home'].includes(e.key) || (e.key === ' ' && e.shiftKey)) && atFloor()) e.preventDefault(); });
addEventListener('scroll', () => { uT = scrollToU(); clampToGate(); if (window.scrollY < logoSec.offsetTop) maxU = Math.max(maxU, uT); if (inView) kick(); }, { passive: true });
// タップ待ちのあいだは、下へのスクロールだけを止める（上へは戻れる）
addEventListener('wheel', e => { if (e.deltaY > 0 && atGate()) e.preventDefault(); }, { passive: false });
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', e => { if (touchY !== null && e.touches[0].clientY < touchY && atGate()) e.preventDefault(); }, { passive: false });
addEventListener('keydown', e => { if (['ArrowDown', 'PageDown', 'End', ' '].includes(e.key) && atGate() && !(e.key === ' ' && document.activeElement && document.activeElement.classList.contains('tap'))) e.preventDefault(); });
new IntersectionObserver(es => es.forEach(en => { inView = en.isIntersecting; snowControl(); if (inView){ uT = scrollToU(); kick(); } })).observe(journey);

/* ------------------------------------------------------------------
   最後の白い帯：リボンが流れてきて、Merry Christmas になる
   ------------------------------------------------------------------ */
const logoSec = $('#logoSec'), rcv = $('#ribbonCv'), rctx = rcv.getContext('2d'), playBtn = $('#playAgain');
let RB = null, pT = 0, pS = 0, rLoop = false, rLast = 0, rView = false;
function buildRibbon(){
  const LW = rcv.clientWidth, LH = rcv.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 3);
  rcv.width = Math.round(LW * dpr); rcv.height = Math.round(LH * dpr); rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const [bx0, by0, bx1, by1] = MERRY.bbox, bw = bx1 - bx0, bh = by1 - by0;
  const s = Math.min(LW * (LH > LW ? 0.92 : 0.86) / bw, LH * 0.46 / bh), ox = LW / 2 - (bx0 + bw / 2) * s, oy = LH * 0.44 - (by0 + bh / 2) * s;
  playBtn.style.top = f1(oy + by1 * s + Math.max(56, LH * 0.09)) + 'px';
  const lines = MERRY.strokes.map(st => st.map(([x, y]) => [ox + x * s, oy + y * s]));
  // 文字の線を1本につなげた長さ（筆を上げるところは数えない）
  const segs = []; let L = 0;
  lines.forEach(pts => { for (let i = 1; i < pts.length; i++){ const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push({ a: pts[i - 1], b: pts[i], s0: L, s1: L + d }); L += d; } });
  // 流れてくるリボンの通り道：左下から大きく弧を描き、最初の文字の書き出しへ
  const st = lines[0][0];
  const ctrl = [[-0.15 * LW, 0.86 * LH], [0.12 * LW, 0.28 * LH], [0.36 * LW, 0.80 * LH], [0.22 * LW, 0.40 * LH], [st[0] - 0.04 * LW, st[1] + 0.12 * LH], st];
  const free = []; for (let i = 0; i < ctrl.length - 1; i++){
    const p0 = ctrl[Math.max(0, i - 1)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(ctrl.length - 1, i + 2)];
    for (let j = 0; j < 40; j++){ const t = j / 40, t2 = t * t, t3 = t2 * t;
      free.push([0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
                 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]); } }
  free.push(st);
  const fsegs = []; let FL = 0; for (let i = 1; i < free.length; i++){ const d = Math.hypot(free[i][0] - free[i - 1][0], free[i][1] - free[i - 1][1]); fsegs.push({ a: free[i - 1], b: free[i], s0: FL, s1: FL + d }); FL += d; }
  RB = { LW, LH, segs, L, fsegs, FL, w: clamp(s * 60, 5, 13) };
}
function ribbonQuad(a, b, wA, wB, col){
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
  rctx.fillStyle = col; rctx.beginPath();
  rctx.moveTo(a[0] + nx * wA, a[1] + ny * wA); rctx.lineTo(b[0] + nx * wB, b[1] + ny * wB);
  rctx.lineTo(b[0] - nx * wB, b[1] - ny * wB); rctx.lineTo(a[0] - nx * wA, a[1] - ny * wA); rctx.closePath(); rctx.fill();
}
function drawRibbonSegs(segs, from, to, sOff, twistAmp, phase){
  const w = RB.w / 2;
  for (const g of segs){
    if (g.s1 < from || g.s0 > to) continue;
    const ta = (sOff + g.s0) / 46 + phase, tb = (sOff + g.s1) / 46 + phase;
    const ca = Math.cos(ta), cb = Math.cos(tb);
    const fa = (1 - twistAmp) + twistAmp * Math.abs(ca), fb = (1 - twistAmp) + twistAmp * Math.abs(cb);
    const front = (ca + cb) / 2 > 0 || twistAmp < 0.3;
    ribbonQuad(g.a, g.b, w * fa, w * fb, front ? '#C8443F' : '#8E2C2A');
  }
}
function sparkle(x, y, r, a){
  rctx.globalAlpha = a; rctx.fillStyle = '#E2B23C'; rctx.beginPath();
  rctx.moveTo(x, y - r); rctx.quadraticCurveTo(x, y, x + r, y); rctx.quadraticCurveTo(x, y, x, y + r); rctx.quadraticCurveTo(x, y, x - r, y); rctx.quadraticCurveTo(x, y, x, y - r); rctx.fill(); rctx.globalAlpha = 1;
}
function drawRibbon(p){
  if (!RB) return;
  rctx.clearRect(0, 0, RB.LW, RB.LH);
  if (reduce){ p = p > 0.2 ? 1 : 0; }
  const flow = smooth(beat(p, [0.04, 0.42])), write = beat(p, [0.34, 0.86]), settle = beat(p, [0.82, 0.96]);
  const twist = lerp(1, 0.18, smooth(settle)), phase = p * 10;
  // 流れてくるリボン：頭は通り道を進み、文字を書き始めると、しっぽも文字の書き出しへ吸い込まれていく
  const head = flow * RB.FL, tail = Math.max(0, lerp(head - RB.FL * 0.55, RB.FL, smooth(beat(p, [0.34, 0.62]))));
  if (head > tail + 1) drawRibbonSegs(RB.fsegs, tail, head, 0, twist, phase);
  // 文字を書いていく
  const Lw = smooth(write) * RB.L;
  if (Lw > 0) drawRibbonSegs(RB.segs, 0, Lw, RB.FL, twist, phase);
  const spk = beat(p, [0.9, 0.99]);
  if (spk > 0){ const { LW, LH } = RB; [[0.14, 0.30, 9], [0.86, 0.28, 8], [0.5, 0.2, 11], [0.08, 0.66, 7], [0.92, 0.68, 7]].forEach(([x, y, r], i) => sparkle(LW * x, LH * y, r * (0.6 + 0.4 * Math.sin(p * 40 + i)), spk)); }
}
function logoProgress(){ const r = logoSec.getBoundingClientRect(), total = Math.max(1, logoSec.offsetHeight - window.innerHeight); return clamp(-r.top / total); }
function rTick(now){
  const dt = Math.min(0.05, (now - rLast) / 1000); rLast = now;
  pS = reduce ? pT : pS + (pT - pS) * (1 - Math.exp(-CFG.SMOOTH * dt)); if (Math.abs(pT - pS) < 0.0005) pS = pT;
  drawRibbon(clamp(pS / CFG.LOGO_END));
  playBtn.classList.toggle('on', pS >= CFG.PLAY_AT);
  if (pS !== pT && rView) requestAnimationFrame(rTick); else rLoop = false;
}
function rKick(){ if (!rLoop){ rLoop = true; rLast = performance.now(); requestAnimationFrame(rTick); } }
addEventListener('scroll', () => { if (!rView) return; pT = logoProgress(); rKick(); }, { passive: true });
new IntersectionObserver(es => es.forEach(en => { rView = en.isIntersecting; if (rView){ pT = logoProgress(); rKick(); } })).observe(logoSec);

/* ------------------------------------------------------------------
   大きさが変わったとき
   ------------------------------------------------------------------ */
function layout(){
  W = stage.clientWidth; Hh = stage.clientHeight;
  MOBILE = Hh / W > 1.25; ZC = MOBILE ? CFG.ZOOM_CLOSE : 1; ZW = MOBILE ? (W / 1440) / Math.max(W / 1440, Hh / 900) : 1;
  strip.style.setProperty('--zc', ZC);
  TS = MOBILE && !reduce ? CFG.M_TOWN_SCREENS : CFG.TOWN_SCREENS; TOWN_S = CFG.TOWNS * TS; S_TOTAL = TOWN_S + CFG.FINALE_SCREENS;
  journey.style.height = ((1 + S_TOTAL) * 100).toFixed(1) + 'svh';
  strip.style.width = (W * panels.length) + 'px'; panels.forEach(p => p.style.width = W + 'px');
  { const sc0 = Math.max(W / 1440, Hh / 900), lw = 1440 * sc0, lh = 900 * sc0;
    strip.querySelectorAll('img.land').forEach(img => Object.assign(img.style, { width: f1(lw) + 'px', height: f1(lh) + 'px', left: f1((W - lw) / 2) + 'px', top: f1(Hh - lh) + 'px' })); }
  bakeClose(); sizeCanvas(); buildHud(); hudTop = hud.getBoundingClientRect().top - stage.getBoundingClientRect().top;
  HUD_BOTTOM = hudTop + hud.getBoundingClientRect().height; visitsEl.style.top = f1(HUD_BOTTOM + 18) + 'px'; soundBtn.style.top = f1(HUD_BOTTOM + 48) + 'px'; TREE_TOP = Math.round(hudTop + hud.getBoundingClientRect().height * 0.85); [treeL, lightL, ornL].forEach(l => l.style.top = TREE_TOP + 'px');
  buildRibbon(); drawRibbon(clamp(pS / CFG.LOGO_END));
  uT = scrollToU(); uS = uT; NOW = performance.now(); render(uS);
}
/* ------------------------------------------------------------------
   BGM：同じフォルダの音声ファイルを、くり返し鳴らす
   音量の上げ下げは、iPhone でも効くように、ページの中の音の通り道（Web Audio）で行う
   ------------------------------------------------------------------ */
const BGM = (() => {
  const SRC = 'bgm.dat', SEED = 0x20261224, VOL = 0.5; // 音量は仮の値
  let audio = null, ac = null, gain = null, on = false, offTimer = 0, loading = null;
  // bgm.dat を読み込み、並べ替えた中身を元に戻して、ページの中だけで使える一時的な音声にする
  function unscramble(buf){
    const b = new Uint8Array(buf); let x = SEED >>> 0;
    for (let i = 0; i < b.length; i++){ x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; b[i] ^= x & 255; }
    return URL.createObjectURL(new Blob([b], { type: 'audio/mpeg' }));
  }
  function load(){
    if (!loading) loading = fetch(SRC).then(r => { if (!r.ok) throw new Error('bgm'); return r.arrayBuffer(); }).then(unscramble).then(url => { audio.src = url; });
    return loading;
  }
  function ramp(to, sec){ const t = ac.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.setValueAtTime(gain.gain.value, t); gain.gain.linearRampToValueAtTime(to, t + sec); }
  function play(){ const p = audio.play(); if (p && p.catch) p.catch(() => {}); }
  function start(){
    if (!audio){
      // ボタンを押したその瞬間に、再生の準備を済ませておく（iPhone で音が止められないように）
      audio = new Audio(); audio.loop = true;
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const node = ac.createMediaElementSource(audio); gain = ac.createGain(); gain.gain.value = 0;
      node.connect(gain); gain.connect(ac.destination);
      play();
    }
    clearTimeout(offTimer); ac.resume(); on = true;
    load().then(() => { if (!on) return; play(); ramp(VOL, 1.2); }).catch(() => {});
  }
  function stop(){
    if (!audio) return;
    on = false; ramp(0, 0.6);
    offTimer = setTimeout(() => { if (!on) audio.pause(); }, 700);
  }
  // ほかのタブに切り替えたら止め、戻ったら続きから
  document.addEventListener('visibilitychange', () => { if (!audio || !on) return; if (document.hidden) audio.pause(); else { ac.resume(); play(); } });
  return { toggle(){ on ? stop() : start(); return on; }, get on(){ return on; }, get audio(){ return audio; } };
})();
const soundBtn = $('#sound');
soundBtn.addEventListener('click', () => { const v = BGM.toggle(); soundBtn.setAttribute('aria-pressed', v ? 'true' : 'false'); });

// 訪問の数：Abacus（https://github.com/JasonLovesDoggo/abacus ）で、開くたびに数を1つ増やし、返ってきた新しい数を「✦ 1,234 lights lit so far」の形で出す
//   数える住所の名前は、英数字と _ - . の3〜64文字（Abacus の決まり）。最後に数えてから6か月間数えられないと、数は消える
const VISITS_LABEL = n => `${n} lights lit so far`;
const VISITS_URL = 'https://abacus.jasoncameron.dev/hit/vvv0w0vvv.github.io/merry-christmas-2026';
const visitsEl = $('#visits'), visitsText = $('#visitsText');
async function hitVisits(){
  try {
    if (!/^https?:$/.test(location.protocol)) return; // ファイルを直接開いたときは数えない・出さない
    const r = await fetch(VISITS_URL, { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json(), n = parseInt(j.value, 10);
    if (!n) return;
    const txt = n.toLocaleString('en-US');
    visitsText.textContent = VISITS_LABEL(txt);
    visitsEl.setAttribute('aria-label', VISITS_LABEL(txt));
    visitsEl.classList.add('ready');
  } catch (e) { /* 受け取れないときは何も出さない */ }
}
hitVisits();
// 「Play again」：集めたオーナメント・ツリーの飾り・前へ戻れない位置をすべて最初に戻し、ページの一番上へ
function playAgain(){
  TOWNS.forEach(T => { T.released = 0; showTap(T.tap, false); });
  FIN.placed = {}; FIN.starT = 0; FIN.done = false; PLACE_KEYS.forEach(k => showTap(placeTaps[k], false));
  maxU = 0; logoReached = false; playBtn.classList.remove('on');
  snowWanted = false; cv.style.opacity = 0; snowControl();
  window.scrollTo(0, 0);
  uT = uS = 0; pT = pS = 0; NOW = performance.now(); render(0); drawRibbon(0);
  // 遊び直しも1回と数える：Abacus で数を1つ増やして表示を新しくし、GoatCounter にも知らせる（https://www.goatcounter.com/help/js ）
  hitVisits();
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: location.pathname, title: document.title }); } catch (e) {}
}
playBtn.addEventListener('click', playAgain);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 150); });
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.scrollTo(0, 0);
layout();
})();
</script>
